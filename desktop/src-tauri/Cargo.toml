[package]
name = "steam-spotify-desktop"
version = "0.1.0"
description = "Steam Spotify desktop wrapper"
authors = ["Steam Spotify"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.5.5", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.10.2", features = ["tray-icon"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
